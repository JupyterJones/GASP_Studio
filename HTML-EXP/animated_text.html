<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Using GSAP ScrambleText</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrambleTextPlugin.min.js"></script>


<style>

@font-face {
  font-display: block;
  font-family: Mori;
  font-style: normal;
  font-weight: 600;
  src: url(https://assets.codepen.io/16327/PPMori-Regular.woff) format("woff");
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
   font-family: "Space Mono", monospace;
  background: #0e100f;
  text-align: center;
  color: #dfdcff;
  line-height: 1;
}

.text-scramble__content {
  max-width: 40ch;
  font-size: max(2rem, min(5.69579vw + 0.665049rem, 3rem));
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.1;
  margin-top: max(2rem, min(2.0712vw + 1.51456rem, 4rem));
  padding-bottom: 1.1em;
  position: relative;
}

.text-scramble__text {
  bottom: 0;
  left: 0;
  position: absolute;
  right: 0;
  top: 0;
}

.text-scramble__text span {
  word-break: break-word;
}

.text-scramble__text img {
  display: inline-block;
  height: 0.9em;
  width: auto;
}
</style>


<div class="text-scramble__content">
  <p id="scramble-text-original">Using GSAP ScrambleText to animate text on a page.</p>

  <p class="text-scramble__text" aria-hidden="true">
    <span id="scramble-text-1"></span>
    <span id="scramble-text-2"></span>
    <span id="scramble-text-3"></span>
    <span id="scramble-text-4"></span>
    <span id="scramble-text-5"></span>

    <img id="scramble-cursor" src="/home/jack/Desktop/GASP_Studio/HTML-EXP/avatarjacksmall.png" alt="" />
  </p>
</div>

<script>

const tl = gsap.timeline({
  id: "text-scramble",
  defaults: { ease: "none" }
});

const cursorTl = gsap.timeline({ repeat: -1 });

gsap.set("#scramble-text-original", {
  opacity: 0
});

cursorTl
  .to("#scramble-cursor", {
    opacity: 0,
    duration: 0.5,
    ease: "none",
    delay: 0.2
  })
  .to("#scramble-cursor", {
    opacity: 1,
    duration: 0.5,
    ease: "none",
    delay: 0.2
  });

tl.to("#scramble-text-1", {
  scrambleText: {
    text: "Using GSAP ",
    chars: "lowerCase"
  },
  duration: 2
})
  .to("#scramble-text-2", {
    scrambleText: {
      text: "ScrambleText to",
      speed: 0.4
    },
    duration: 2
  })
  .to("#scramble-text-3", {
    scrambleText: {
      text: "animate text" },
    duration: 2
  })
  .to("#scramble-text-4", {
    scrambleText: { 
    text: "FlaskArchitect Dot Com", speed: 0.3 },
    duration: 1
  })
  .to("#scramble-text-5", {
    scrambleText: {
      text: "flaskarchchitect.com",
      speed: 0.3
    },
    duration: 1.5
  })
  .add(cursorTl);

window.onclick = () => tl.play(0); // click to replay

</script>
